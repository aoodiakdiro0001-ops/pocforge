<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoCForge | Bug Bounty PoC Report Builder</title>
<meta name="description" content="Build formatted Proof-of-Concept reports with payloads in cURL, Python and HTML for authorized bug bounty submissions.">
<link rel="canonical" href="https://aoodiakdiro0001-ops.github.io/pocforge/">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Consolas,monospace}
:root{--bg:#0b0e17;--panel:#131a30;--line:#283257;--grn:#34d399;--blu:#60a5fa;--ylw:#fbbf24;--red:#f87171;--txt:#dde4f4;--mut:#8b98b8}
body{background:var(--bg);color:var(--txt)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-size:22px;font-weight:900;color:var(--red)}
.logo small{display:block;font-size:11px;color:var(--mut);font-weight:400}
header select{margin-left:auto;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:7px 10px;font-size:13px}
.tabs{display:flex;gap:6px;padding:14px 16px 0;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.tabs button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-bottom:none;padding:10px 16px;border-radius:12px 12px 0 0;cursor:pointer;font-weight:800;font-size:13px}
.tabs button.on{background:#1c2547;color:var(--red)}
main{max-width:1100px;margin:0 auto;padding:18px 15px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:0 14px 14px 14px;padding:22px;display:none}
.panel.on{display:block}
.panel h2{color:var(--red);margin-bottom:6px;font-size:19px}
.panel p.sub{color:var(--mut);font-size:13px;margin-bottom:12px;line-height:1.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.box{background:#0b0e17;border:1px solid var(--line);border-radius:14px;padding:16px}
.box h3{font-size:14px;color:var(--blu);margin-bottom:10px}
label.fl{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 3px}
input[type=text],select,textarea{background:#0b0e17;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 13px;font-size:13.5px;outline:none;width:100%}
textarea{min-height:80px;font-family:Consolas,monospace;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
button.go{background:var(--red);color:#1c0505;border:none;padding:11px 26px;border-radius:10px;font-weight:900;cursor:pointer;font-size:14px}
button.alt{background:transparent;color:var(--blu);border:1px solid var(--blu);padding:9px 16px;border-radius:10px;cursor:pointer;font-size:13px}
pre.out{background:#0b0e17;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12.5px;overflow:auto;max-height:520px;direction:ltr;text-align:left;white-space:pre-wrap}
.note{background:#1c2547;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--mut);margin:10px 0;line-height:1.7}
.sev{display:inline-block;font-size:12px;font-weight:900;padding:4px 14px;border-radius:12px}
.s-Critical{background:#3d1414;color:var(--red)} .s-High{background:#3d2410;color:var(--ylw)} .s-Medium{background:#3a2c10;color:var(--ylw)} .s-Low{background:#0e2a1d;color:var(--grn)}
.hist{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.donate{background:linear-gradient(135deg,#1c2547,#0e2a1d);border:1px solid var(--grn);border-radius:16px;padding:20px;text-align:center;margin-top:8px;font-size:13px}
.donate .addr{background:#0b0e17;border-radius:10px;padding:10px;font-family:monospace;font-size:12px;word-break:break-all;direction:ltr;margin:6px auto;color:var(--grn);max-width:560px}
.adslot{max-width:1100px;margin:12px auto 0;padding:0 15px;text-align:center}
.adslot .ph{display:block;border:1px dashed var(--line);border-radius:10px;color:var(--mut);font-size:12px;padding:10px}
footer{text-align:center;color:var(--mut);font-size:12.5px;padding:26px 16px;border-top:1px solid var(--line);line-height:2}
footer a{color:var(--grn)}
#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 25px;border-radius:25px;z-index:200;display:none;font-size:14px;max-width:92vw;text-align:center}
</style>
</head>
<body>
<header>
<div class="logo">📝 PoCForge<small data-i="tag"></small></div>
<select id="langSel" onchange="setLang(this.value)">
<option value="en" selected>🇬🇧 English</option><option value="tr">🇹🇷 Türkçe</option><option value="ar">🇸🇦 العربية</option>
</select>
</header>
<div class="note" style="max-width:1100px;margin:12px auto 0"><span data-i="legalNote" style="display:block;background:#3d1414;border:1px solid var(--red);color:#ffb4b4;border-radius:10px;padding:10px 14px;font-size:12.5px"></span></div>
<div class="tabs" id="tabs"></div>
<main>
<section class="panel on" id="p-build">
<h2 data-i="bT"></h2><p class="sub" data-i="bS"></p>
<div class="grid2">
<div class="box"><h3 data-i="inT"></h3>
<label class="fl" data-i="fType"></label><select id="vType"></select>
<label class="fl" data-i="fTarget"></label><input type="text" id="vTarget" data-i-ph="targetPh" style="direction:ltr">
<label class="fl" data-i="fParam"></label><input type="text" id="vParam" value="q" style="direction:ltr;max-width:200px">
<label class="fl" data-i="fMethod"></label><select id="vMethod" style="max-width:150px"><option>GET</option><option>POST</option></select>
<label class="fl" data-i="fPayload"></label><select id="vPayload"></select>
<label class="fl" data-i="fSev"></label><select id="vSev" style="max-width:180px"><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select>
<label class="fl" data-i="fHandle"></label><input type="text" id="vHandle" data-i-ph="handlePh" style="max-width:220px">
<div class="row"><button class="go" onclick="buildPoC()" data-i="btnBuild"></button></div>
</div>
<div class="box"><h3 data-i="outT"></h3><div id="pocOut"><p style="color:var(--mut)">—</p></div></div>
</div>
</section>
<section class="panel" id="p-hist">
<h2 data-i="hT"></h2><p class="sub" data-i="hS"></p>
<div class="row"><button class="alt" onclick="exportHist()" data-i="btnExp"></button><button class="alt" onclick="clearHist()" data-i="btnClear"></button></div>
<div id="histList"></div>
</section>
<section class="panel" id="p-donate">
<h2 data-i="doT"></h2><p class="sub" data-i="doS"></p>
<div class="donate">
<div>₿ BTC</div><div class="addr" id="btcA"></div>
<div>₮ USDT-TRC20</div><div class="addr" id="usdtA"></div>
<div class="row" style="justify-content:center"><button class="alt" onclick="copyTxt(document.getElementById('btcA').textContent)" data-i="btnCopy"></button></div>
<div style="font-size:12.5px">🏦 Baran Avisat — TRY: <code dir="ltr">TR10 0001 0090 1008 4013 0050 01</code></div>
<div style="font-size:12.5px">🏦 Baran Avisat — USD: <code dir="ltr">TR80 0001 0090 1008 4013 0050 02</code></div>
</div>
</section>
</main>
<div class="adslot" id="adFoot"><span class="ph" data-i="adHere" style="display:block;border:1px dashed var(--line);border-radius:10px;color:var(--mut);font-size:12px;padding:10px"></span></div>

function tab(w){TABS.forEach(x=>{const b=document.getElementById('tab-'+x[0]);if(b)b.classList.toggle('on',w===x[0]);document.getElementById('p-'+x[0]).classList.toggle('on',w===x[0]);});}
function toast(m){let d=document.getElementById('toast');d.textContent=m;d.style.display='block';clearTimeout(d._h);d._h=setTimeout(()=>d.style.display='none',2200);}
function copyTxt(x){try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x);}catch(e){}toast(t('copied'));}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

document.getElementById('vType').innerHTML=VTYPES.map((v,i)=>`<option value="${i}">${vName(v)} (${v.sev})</option>`).join('');
fillPayloads();
document.getElementById('vType').onchange=fillPayloads;
}
function fillPayloads(){
const v=VTYPES[+document.getElementById('vType').value||0]||VTYPES[0];
document.getElementById('vPayload').innerHTML=v.pl.map((p,i)=>`<option value="${i}">${esc(p).slice(0,60)}</option>`).join('');
document.getElementById('vSev').value=v.sev;
}
function curlOf(method,target,param,payload){
const sep=target.includes('?')?'&':'?';
if(method==='GET')return `curl -i '${target}${sep}${param}=`+encodeURIComponent(payload).replace(/'/g,'%27')+`'`;
return `curl -i -X POST '${target}' \\\n  -H 'Content-Type: application/x-www-form-urlencoded' \\\n  --data-urlencode '${param}=`+payload.replace(/'/g,"'\\''")+`'`;
}
function pyOf(method,target,param,payload){
const sep=target.includes('?')?'&':'?';
if(method==='GET')return `import requests\n\nurl = "${target}${sep}${param}=" + __import__('urllib').parse.quote(${JSON.stringify(payload)})\nprint(requests.get(url, timeout=20).text[:2000])`;
return `import requests\n\nr = requests.post(${JSON.stringify(target)}, data={${JSON.stringify(param)}: ${JSON.stringify(payload)}}, timeout=20)\nprint(r.status_code)\nprint(r.text[:2000])`;
}
function htmlOf(target,param,payload){
return `<!-- PoC — open in a test browser profile -->\n<a href="${target.replace(/"/g,'&quot;')}?${param}=${encodeURIComponent(payload)}">click to test ${param}</a>\n<script>/* location = document.links[0].href; */<\/script>`;
}
function buildReport(o){
const L=[];
L.push(`# [${o.sev}] ${o.vuln} — ${o.target}`);
L.push('');
L.push(`## ${t('rpSum')}`);
L.push(`${o.vuln} via parameter \`${o.param}\` on ${o.target}.`);
L.push('');
L.push(`## ${t('rpSev')}: **${o.sev}**`);
L.push('');
L.push(`## ${t('rpSteps')}`);
L.push(`1. ${t('st1')}: \`${o.target}\``);
L.push(`2. ${t('st2')} \`${o.param}\`: \`${o.payload}\``);
L.push(`3. ${t('st3')}`);
L.push(`4. ${t('st4')}`);
L.push('');
L.push(`## ${t('rpPoc')} (cURL)`);
L.push('```bash');
L.push(o.curl);
L.push('```');
L.push('');
L.push(`## ${t('rpPoc')} (Python)`);
L.push('```python');
L.push(o.py);
L.push('```');
L.push('');
L.push(`## ${t('rpPoc')} (HTML)`);
L.push('```html');
L.push(o.html);
L.push('```');
L.push('');
L.push(`## ${t('rpImpact')}`);
L.push(t('impD'));
L.push('');
L.push(`## ${t('rpFix')}`);
L.push(o.fix);
L.push('');
L.push(`## ${t('rpRef')}`);
L.push(o.ref);
if(o.handle){L.push('');L.push(`## ${t('rpBy')} ${o.handle}`);}
return L.join('\n');
}
let lastMD='';
function buildPoC(){
const v=VTYPES[+document.getElementById('vType').value||0]||VTYPES[0];
const target=document.getElementById('vTarget').value.trim();
const param=(document.getElementById('vParam').value.trim()||'q');
const method=document.getElementById('vMethod').value;
const payload=v.pl[+document.getElementById('vPayload').value||0]||v.pl[0];
const sev=document.getElementById('vSev').value;
const handle=document.getElementById('vHandle').value.trim();
if(!/^https?:\/\//i.test(target)||!payload){toast(t('needAll'));return;}
const o={vuln:vName(v),target,param,method,payload,sev,handle,
curl:curlOf(method,target,param,payload),py:pyOf(method,target,param,payload),html:htmlOf(target,param,payload),
fix:v.fix[lang]||v.fix.en,ref:v.ref};
lastMD=buildReport(o);
saveHist('['+sev+'] '+vName(v)+' — '+target,lastMD);
document.getElementById('pocOut').innerHTML=`<span class="sev s-${sev}">${sev}</span><pre class="out">${esc(lastMD)}</pre><div class="row"><button class="alt" onclick="copyTxt(lastMD)">${t('btnCopy')}</button><button class="alt" onclick="dlMD()">${t('btnDl')}</button></div>`;
renderHist();
}
function dlMD(){if(!lastMD)return;const b=new Blob([lastMD],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='poc-report.md';a.click();toast(t('dlDone'));}
function hist(){try{return JSON.parse(localStorage.getItem('poc_hist')||'[]');}catch(e){return [];}}
function saveHist(title,md){try{const h=hist();h.unshift({id:'P'+Date.now().toString(36).toUpperCase(),title,md,time:new Date().toLocaleString()});localStorage.setItem('poc_hist',JSON.stringify(h.slice(0,100)));}catch(e){}}
function renderHist(){
const h=hist();
document.getElementById('histList').innerHTML=h.map((x,i)=>`<div class="hist"><b style="flex:1">${esc(x.title)}</b><small style="color:var(--mut)">${esc(x.time||'')}</small><button class="alt" style="padding:5px 12px;font-size:12px" onclick="loadHist(${i})">${t('btnCopy').replace(/Copy|Kopyala|نسخ/,'↩')}</button><button class="alt" style="padding:5px 12px;font-size:12px" onclick="delHist(${i})">❌</button></div>`).join('')||'<p style="color:var(--mut)">—</p>';
}
function loadHist(i){const x=hist()[i];if(!x)return;lastMD=x.md;tab('build');
document.getElementById('pocOut').innerHTML=`<pre class="out">${esc(lastMD)}</pre><div class="row"><button class="alt" onclick="copyTxt(lastMD)">${t('btnCopy')}</button><button class="alt" onclick="dlMD()">${t('btnDl')}</button></div>`;toast(t('loaded'));}
function delHist(i){try{const h=hist();h.splice(i,1);localStorage.setItem('poc_hist',JSON.stringify(h));}catch(e){}renderHist();}
function exportHist(){const b=new Blob([JSON.stringify(hist(),null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pocforge-history.json';a.click();toast(t('expDone'));}
function clearHist(){try{localStorage.removeItem('poc_hist');}catch(e){}renderHist();toast(t('cleared'));}
function renderDonate(){
document.getElementById('btcA').textContent=CONFIG.pay.btc;
document.getElementById('usdtA').textContent=CONFIG.pay.usdt;
}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}}
setLang('en');loadAds();renderDonate();
</script>
